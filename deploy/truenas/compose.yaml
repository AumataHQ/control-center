# The newsroom, on TrueNAS.
#
# Control Center has no login. Every port here is published on ONE address —
# ${BIND_ADDRESS}, the host's Tailscale address — because that binding is the
# access control. Do not change these to 0.0.0.0.

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: newsroom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER_REDIRECT_URL: http://${BIND_ADDRESS}:9001
    volumes:
      - ${NEWSROOM_ROOT}/minio:/data
    ports:
      - "${BIND_ADDRESS}:9000:9000"
      - "${BIND_ADDRESS}:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Pulls the publication pipeline's trail down from object storage into the
  # directory the dashboard reads. `mc mirror` without --remove never deletes,
  # which is deliberate: the newsroom is an archive of what the pipeline did,
  # not a replica of its current working directory.
  newsroom-mirror:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: newsroom-mirror
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    user: "1001:1001"
    environment:
      MC_HOST_newsroom: http://${NEWSROOM_S3_ACCESS_KEY_ID:?set NEWSROOM_S3_ACCESS_KEY_ID in .env}:${NEWSROOM_S3_SECRET_ACCESS_KEY:?set NEWSROOM_S3_SECRET_ACCESS_KEY in .env}@minio:9000
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - ${NEWSROOM_ROOT}/pipeline:/pipeline
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          mc mirror --overwrite --quiet \
            "newsroom/${NEWSROOM_S3_BUCKET:-signalscribe-backups}/${NEWSROOM_S3_PREFIX:-newsroom}" /pipeline \
            || echo "mirror pass failed, retrying next cycle"
          sleep "${NEWSROOM_MIRROR_INTERVAL:-300}"
        done

  control-center:
    image: ${CONTROL_CENTER_IMAGE:-control-center:local}
    container_name: newsroom-control-center
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      newsroom-mirror:
        condition: service_started
    environment:
      # The hostnames the API answers on. A request arriving with any other
      # Host is refused, which is what stops a page you visit from driving your
      # browser in here. It is not a substitute for the port binding above.
      CONTROL_CENTER_ALLOWED_HOSTS: ${CONTROL_CENTER_ALLOWED_HOSTS:?set CONTROL_CENTER_ALLOWED_HOSTS in .env}
      CONTROL_CENTER_DATA_DIR: /data
    volumes:
      - ${NEWSROOM_ROOT}/control-center:/data
      # The pipeline's artifacts, synced from the publication host. Read-only:
      # the dashboard observes the pipeline, it does not write to it.
      - ${NEWSROOM_ROOT}/pipeline:/newsroom:ro
    ports:
      - "${BIND_ADDRESS}:${CONTROL_CENTER_PORT:-3010}:3000"
